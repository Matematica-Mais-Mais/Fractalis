<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractal de Newton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
  
</head>
<body>

  <div class="container">
    
    <header>
      <div class="title">
        <h1 id="headerFormula">f(x) = x^10 - x^2 + 1</h1>
        <p>Plano complexo · Domínio [-2, 2]</p>
      </div>
    </header>

    <div class="app-layout">

      <!-- Painel de Controle -->
      <div class="panel">
        <div class="panel-title">Parâmetros</div>

        <div class="field">
          <label for="inFuncao">Polinômio f(x)</label>
          <input type="text" id="inFuncao" value="x^10 - x^2 + 1">
          <div class="presets">
            <button class="preset-btn" onclick="setPreset('x^10 - x^2 + 1')">x¹⁰-x²+1</button>
            <button class="preset-btn" onclick="setPreset('x^3 - 1')">x³-1</button>
            <button class="preset-btn" onclick="setPreset('x^5 - x + 1')">x⁵-x+1</button>
            <button class="preset-btn" onclick="setPreset('x^4 - 1')">x⁴-1</button>
          </div>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="inLargura">Largura (px)</label>
            <input type="number" id="inLargura" value="600">
          </div>
          <div class="field">
            <label for="inAltura">Altura (px)</label>
            <input type="number" id="inAltura" value="600">
          </div>
        </div>

        <div class="row-2">
          <div class="field">
            <label for="inIteracoes">Iterações</label>
            <input type="number" id="inIteracoes" value="50">
          </div>
          <div class="field">
            <label for="inPasso">Passo</label>
            <input type="number" id="inPasso" value="1" step="0.1">
          </div>
        </div>

        <div class="field">
          <label for="inTolerancia">Tolerância</label>
          <input type="number" id="inTolerancia" value="0.00001" step="0.00001">
        </div>

        <div class="field">
          <label class="checkbox-field" for="inUsarBrilho">
            <input type="checkbox" id="inUsarBrilho" checked>
            <span>Brilho por velocidade de convergência</span>
          </label>
        </div>

        <div class="row-2" id="brilhoControls">
          <div class="field">
            <label for="inFatorBrilho">Fator de brilho</label>
            <input type="number" id="inFatorBrilho" value="2.5" step="0.1" min="0">
          </div>
          <div class="field">
            <label for="inBrilhoMaximo">Brilho máx.: <span id="valBrilhoMaximo">50</span></label>
            <input type="range" id="inBrilhoMaximo" min="0" max="255" step="1" value="50">
          </div>
        </div>

        <button class="btn-main" id="btnGerar">Gerar Fractal</button>
        <button class="btn-sub" id="btnBaixar">Baixar PNG</button>

        <div class="panel-title" style="margin-top: 8px;">Raízes Encontradas</div>
        <div class="roots-container" id="rootsList">
          <span style="color: var(--muted)">Aguardando geração...</span>
        </div>
      </div>

      <!-- Área de Saída -->
      <div class="panel">
        <div class="viewport">
          <canvas id="fractalCanvas" width="600" height="600"></canvas>
          <div class="placeholder" id="placeholder">Clique em "Gerar Fractal"</div>
        </div>

        <div class="stats">
          <div class="stat-card">
            <span>Raízes</span>
            <strong id="statRaizes">—</strong>
          </div>
          <div class="stat-card">
            <span>Sem Convergência</span>
            <strong id="statNaoConv">—</strong>
          </div>
          <div class="stat-card">
            <span>Tempo</span>
            <strong id="statTempo">—</strong>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
